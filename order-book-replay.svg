<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Order book replay</title>
  <desc id="desc">An illustrative market buy for five units fills two at $100.02 and then three at $100.03.</desc>
  <defs>
    <pattern id="matrix" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1" fill="#263d49"/>
    </pattern>
    <g id="unit" fill="currentColor">
      <circle cx="-4" cy="-4" r="2.1"/><circle cx="4" cy="-4" r="2.1"/>
      <circle cx="-4" cy="4" r="2.1"/><circle cx="4" cy="4" r="2.1"/>
    </g>
  </defs>
  <style>
    .type { font-family: monospace; }
    .trail { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .trail { animation: route 6.4s linear infinite; }
      .first { animation: first-fill 6.4s linear infinite; }
      .second { animation: second-fill 6.4s linear infinite; }
    }
    @keyframes route {
      0%, 7%, 82%, 100% { opacity: 0; }
      17%, 68% { opacity: .8; }
    }
    @keyframes first-fill {
      0%, 20%, 100% { opacity: .26; }
      32%, 87% { opacity: 1; }
      95% { opacity: .26; }
    }
    @keyframes second-fill {
      0%, 43%, 100% { opacity: .26; }
      57%, 87% { opacity: 1; }
      95% { opacity: .26; }
    }
  </style>
  <rect x=".5" y=".5" width="719" height="259" rx="19" fill="#0b141c" stroke="#314651"/>
  <g class="type">
    <text x="28" y="48" fill="#ebf4f5" font-size="33" font-weight="700">Order book replay</text>
    <text x="28" y="80" fill="#a9bec7" font-size="22">Illustrative fill</text>
    <rect x="27" y="99" width="666" height="138" rx="10" fill="url(#matrix)"/>
    <path d="M186 179H245V145H305 M245 179V207H305" fill="none" stroke="#3e5d69" stroke-width="2" stroke-dasharray="2 6"/>
    <path class="trail" d="M186 179H245V145H305 M245 179V207H305" fill="none" stroke="#82e7ca" stroke-width="3" stroke-dasharray="2 6"/>
    <text x="42" y="151" fill="#ebf4f5" font-size="25" font-weight="700">Buy 5</text>
    <g color="#d3e0e7">
      <use href="#unit" x="49" y="179"/><use href="#unit" x="75" y="179"/>
      <use href="#unit" x="101" y="179"/><use href="#unit" x="127" y="179"/>
      <use href="#unit" x="153" y="179"/>
    </g>
    <g class="first" color="#82e7ca">
      <use href="#unit" x="321" y="145"/><use href="#unit" x="347" y="145"/>
    </g>
    <g class="second" color="#a0bcff">
      <use href="#unit" x="321" y="207"/><use href="#unit" x="347" y="207"/>
      <use href="#unit" x="373" y="207"/>
    </g>
    <text x="405" y="154" fill="#82e7ca" font-size="27" font-weight="700">2 at $100.02</text>
    <text x="405" y="216" fill="#a0bcff" font-size="27" font-weight="700">3 at $100.03</text>
  </g>
</svg>
