name: Refresh public profile
on:
  schedule:
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-activity.yml
      - scripts/profile_activity.py

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate activity section
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/profile_activity.py
      - name: Refresh notebook graphs
        continue-on-error: true
        run: python3 scripts/refresh_quant_figures.py
      - name: Publish changes
        run: |
          git add README.md quant-experiments.svg order-book-simulation.svg
          if [ -f language-matrix.svg ]; then git add language-matrix.svg; fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile activity, languages, and notebook graphs'
          git push origin HEAD:main
