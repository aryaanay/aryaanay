<svg xmlns="http://www.w3.org/2000/svg" width="920" height="256" viewBox="0 0 920 256" role="img" aria-labelledby="title">
<title id="title">Anay Arya — AI research and market models</title>
<style>
  /* Hallmark: technical editorial, cobalt field and mint traces. */
  /* Keep the name readable at narrow widths. Confine motion to the circuitry. */
  :root {
    --ink:#0b1224; --deep:#111c37; --grid:#2e4265; --rim:#3b5570;
    --paper:#f5f8ef; --secondary:#b5c8da; --mint:#aaffd9; --blue:#5d95ff;
    --body:system-ui,sans-serif; --mono:ui-monospace,Consolas,monospace;
  }
  .name { fill:var(--paper); font:760 86px var(--body); letter-spacing:-4px; }
  .line { fill:var(--secondary); font:25px var(--body); }
  .handle { fill:var(--mint); font:21px var(--mono); }
  .wire { fill:none; stroke:var(--rim); stroke-width:1.4; }
  .chip { fill:var(--deep); stroke:var(--rim); stroke-width:1.5; }
  .node { fill:var(--deep); stroke:var(--mint); stroke-width:1.4; }
  .pulse { display:none; fill:none; stroke:var(--mint); stroke-width:3; stroke-linecap:round; stroke-dasharray:.13 1.87; }
  @media (prefers-reduced-motion:no-preference) {
    .pulse { display:inline; animation:send 2.4s cubic-bezier(.28,.6,.33,1) both; }
    .second { animation-delay:.28s; }
    .third { animation-delay:.58s; }
    @keyframes send { from { stroke-dashoffset:.16; } to { stroke-dashoffset:-1.02; } }
  }
</style>
<defs>
  <linearGradient id="field" x2="1" y2="1"><stop style="stop-color:var(--ink)"/><stop offset="1" style="stop-color:var(--deep)"/></linearGradient>
  <radialGradient id="ambient"><stop style="stop-color:var(--blue)" stop-opacity=".30"/><stop offset="1" style="stop-color:var(--blue)" stop-opacity="0"/></radialGradient>
  <pattern id="points" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" style="fill:var(--grid)"/></pattern>
  <clipPath id="frame"><rect width="920" height="256" rx="19"/></clipPath>
  <linearGradient id="edge"><stop style="stop-color:var(--mint)"/><stop offset="1" style="stop-color:var(--blue)"/></linearGradient>
</defs>
<g clip-path="url(#frame)">
  <rect width="920" height="256" fill="url(#field)"/>
  <ellipse cx="730" cy="133" rx="255" ry="174" fill="url(#ambient)"/>
  <path d="M525 0H920V256H475Z" fill="url(#points)"/>
  <rect x="1" y="1" width="918" height="254" rx="18" fill="none" style="stroke:var(--rim)"/>
</g>
<text class="handle" x="45" y="61">@aryaanay</text>
<text class="name" x="40" y="144">Anay Arya</text>
<text class="line" x="45" y="187">AI research &amp; market models</text>
<path d="M46 219H177" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>
<g stroke-linecap="round" stroke-linejoin="round">
  <path class="wire" d="M514 78h57l43 44h68M530 130h79l35 34h65M547 199h53l44-35M694 87l41-39h58M766 89h45l37-36h30M795 126h64l25-23M766 169h51l40 38h34M742 189l40 37h48"/>
  <path class="wire" d="M733 65l75 64-75 64-75-64zM733 49l94 80-94 80-94-80z"/>
  <path class="chip" d="M733 81l56 48-56 48-56-48z"/>
  <path d="M733 95l40 34-40 34-40-34z" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <path d="M715 132l12-13 10 14 14-12" fill="none" style="stroke:var(--mint)" stroke-width="2.5"/>
  <path class="pulse" pathLength="1" d="M514 78h57l43 44h62"/>
  <path class="pulse second" pathLength="1" d="M547 199h53l44-35h56"/>
  <path class="pulse third" pathLength="1" d="M789 129h70l25-26"/>
  <circle class="node" cx="514" cy="78" r="4"/><circle class="node" cx="547" cy="199" r="4"/><circle class="node" cx="884" cy="103" r="4"/>
  <circle class="node" cx="793" cy="48" r="3"/><circle class="node" cx="891" cy="207" r="3"/>
</g>
</svg>
